name: Preparar arquivos do site
on:
  push:
    paths:
      - 'site-package.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extrair arquivos do site
        run: |
          python3 - <<'PY'
          import base64, io, pathlib, tarfile, gzip
          root = pathlib.Path(".").resolve()
          raw = base64.b64decode(pathlib.Path("site-package.txt").read_text().strip())
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(raw)), mode="r:") as archive:
              for member in archive.getmembers():
                  path = (root / member.name).resolve()
                  if not path.is_relative_to(root) or not member.isfile():
                      raise ValueError("Arquivo fora do projeto ou formato inesperado")
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.extractfile(member).read())
          PY
      - name: Publicar arquivos no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css script.js assets/favicon.svg assets/pixora-logo.png README.txt
          if ! git diff --cached --quiet; then
            git commit -m "Adicionar estilos, interações e identidade visual Pixora"
            git push
          fi
